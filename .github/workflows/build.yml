name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit
          done
      - name: Build
        run: swift build
